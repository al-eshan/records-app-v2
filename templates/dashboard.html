{% extends "base.html" %}

{% block content %}

<style>
  .container-fluid.py-3 {
    padding-top: 0 !important;
    padding-bottom: 0 !important;
  }

  .dashboard-full {
    width: 100%;
    height: calc(100vh - 60px);
    min-height: 620px;
    overflow: hidden;
    background: #fff;
  }

  .dashboard-full iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
  }

  @media (max-width: 767.98px) {
    .dashboard-full {
      height: calc(100vh - 125px);
      min-height: 520px;
    }
  }
</style>

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2" dir="rtl">
  <span class="text-muted small">في حال عدم ظهور التقرير داخل الصفحة، افتحه مباشرة من Power BI.</span>
  <a class="btn btn-primary btn-sm" href="https://app.powerbi.com/links/Zd5FGifcP-?ctid=f1f5df63-2c98-408b-819b-8e86b64f038c&amp;pbi_source=linkShare&amp;bookmarkGuid=a2275197-6761-40b3-b556-8ad8b8c32980" target="_blank" rel="noopener noreferrer">فتح لوحة المتابعة في Power BI ↗</a>
</div>

<div class="dashboard-full">
  <iframe
    title="لوحة المتابعة - Power BI"
    src="https://app.powerbi.com/links/Zd5FGifcP-?ctid=f1f5df63-2c98-408b-819b-8e86b64f038c&amp;pbi_source=linkShare&amp;bookmarkGuid=a2275197-6761-40b3-b556-8ad8b8c32980"
    frameborder="0"
    allowfullscreen="true"
  ></iframe>
</div>

{% endblock %}
